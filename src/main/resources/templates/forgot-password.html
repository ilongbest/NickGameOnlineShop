<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - G-SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Sử dụng lại toàn bộ :root và CSS của trang login bạn đã cung cấp[cite: 10] */
        :root { --primary: #ff416c; --secondary: #ff4b2b; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; }
        .auth-card { background: var(--glass); backdrop-filter: blur(20px); padding: 40px; border-radius: 30px; border: 1px solid var(--glass-border); width: 100%; max-width: 400px; text-align: center; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 15px 15px 15px 45px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: white; outline: none; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); }
        .btn-auth { width: 100%; padding: 15px; background: linear-gradient(to right, var(--primary), var(--secondary)); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; }
        .btn-otp { position: absolute; right: 5px; top: 5px; bottom: 5px; padding: 0 15px; background: var(--primary); border: none; border-radius: 8px; color: white; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>
<div class="auth-card">
    <h2 style="margin-bottom: 10px;">Lấy lại mật khẩu</h2>
    <p style="margin-bottom: 30px; opacity: 0.6; font-size: 0.9rem;">Nhập email để xác thực tài khoản</p>

    <div th:if="${error}" class="alert" style="background: rgba(255, 75, 43, 0.2); border: 1px solid var(--secondary); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem;" th:text="${error}"></div>

    <form th:action="@{/forgot-password/verify}" method="post">
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" id="email" placeholder="Email đăng ký" required>
            <button type="button" class="btn-otp" onclick="sendOtp()">GỬI MÃ</button>
        </div>
        <div class="input-group">
            <i class="fas fa-key"></i>
            <input type="text" name="otp" placeholder="Mã OTP" required>
        </div>
        <button type="submit" class="btn-auth">XÁC THỰC OTP</button>
    </form>

    <div style="margin-top: 25px; font-size: 0.9rem; opacity: 0.7;">
        <a href="/login" style="color: var(--primary); text-decoration: none;"><i class="fas fa-arrow-left"></i> Quay lại đăng nhập</a>
    </div>
</div>

<script>
    function sendOtp() {
        const email = document.getElementById('email').value;
        if(!email) { alert("Vui lòng nhập email!"); return; }

        fetch(`/api/send-otp?email=${email}`, { method: 'POST' })
    .then(res => res.text())
            .then(data => alert(data))
            .catch(err => alert("Lỗi gửi OTP!"));
    }
</script>
</body>
</html>
