<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng | G-SHOP Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00d4ff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #16213e, #0f0c29);
            color: #e0e0e0;
            min-height: 100vh;
            margin: 0;
        }
        .sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .nav-link {
            color: #aaa;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--primary-color);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .table { color: #e0e0e0; vertical-align: middle; }
        .price-text { color: var(--primary-color); font-weight: 600; }
        .dot-green { width: 10px; height: 10px; background: #00ff88; border-radius: 50%; display: inline-block; }
        .dot-red { width: 10px; height: 10px; background: #ff4b2b; border-radius: 50%; display: inline-block; }
        .form-control, .form-select { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #fff; }
        .modal-content {
            background: #1a1a2e;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            color: #e0e0e0;
        }
        .modal-header {
            border-bottom: 1px solid var(--border-color);
        }
        .modal-footer {
            border-top: 1px solid var(--border-color);
        }
        .btn-close {
            filter: invert(1);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="text-center mb-5">
                <h3 class="fw-bold" style="letter-spacing: 2px;">G-SHOP <span class="text-primary">ADMIN</span></h3>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/accounts}">
                        <i class="fas fa-gamepad me-2"></i> Kho Nick Game
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/users}">
                        <i class="fas fa-users me-2"></i> Quản lý người dùng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/orders}">
                        <i class="fas fa-wallet me-2"></i> Quản lý số dư
                    </a>
                </li>
                <li class="nav-item mt-5">
                    <a class="nav-link text-danger" th:href="@{/logout}">
                        <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2">Quản lý người dùng</h1>
            </div>

            <div class="glass-card">
                <h5 class="mb-4">Danh sách người dùng</h5>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên người dùng</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái hoạt động</th>
                            <th>Trạng thái tài khoản</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <span th:if="${user.avatarUrl != null && !user.avatarUrl.isEmpty()}" class="me-2">
                                        <img th:src="${user.avatarUrl}" alt="Avatar" style="width: 30px; height: 30px; border-radius: 50%;">
                                    </span>
                                    <span th:text="${user.username}"></span>
                                </div>
                            </td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span th:if="${user.role == 'ADMIN' || user.role == 'ROLE_ADMIN'}" class="badge" style="background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid #00d4ff;">Admin</span>
                                <span th:if="${user.role == 'USER' || user.role == 'ROLE_USER' || user.role == null || user.role.isEmpty()}" class="badge" style="background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88;">User</span>
                            </td>
                            <td>
                                <span class="me-1" th:class="${T(com.example.demo.controller.AdminUserController).isUserOnline(user) ? 'dot-green' : 'dot-red'}"></span>
                                <span th:text="${T(com.example.demo.controller.AdminUserController).isUserOnline(user) ? 'Online' : 'Offline'}"></span>
                            </td>
                            <td>
                                <span th:if="${user.enabled == null || user.enabled}" class="badge" style="background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88;">Hoạt động</span>
                                <span th:if="${user.enabled != null && !user.enabled}" class="badge" style="background: rgba(255, 75, 43, 0.2); color: #ff4b2b; border: 1px solid #ff4b2b;">Vô hiệu hóa</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/admin/users/detail/{id}(id=${user.id})}" class="btn btn-sm btn-outline-info me-1">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:if="${user.role != 'ADMIN' && user.role != 'ROLE_ADMIN'}" th:href="@{/admin/users/toggle/{id}(id=${user.id})}" class="btn btn-sm" th:classappend="${user.enabled == null || user.enabled ? 'btn-outline-warning' : 'btn-outline-success'}">
                                    <i th:class="${user.enabled == null || user.enabled ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Thông báo -->
<div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thông báo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalMessage"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Hàm hiển thị modal thông báo
    function showNotification(title, message, isSuccess) {
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
        
        modalTitle.innerHTML = '<i class="fas fa-' + (isSuccess ? 'check-circle' : 'exclamation-triangle') + ' me-2" style="color: ' + (isSuccess ? '#00ff88' : '#ff4b2b') + ';"></i>' + title;
        modalMessage.textContent = message;
        modal.show();
    }

    // Kiểm tra và hiển thị thông báo khi trang load
    window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('toggleSuccess')) {
            showNotification('Thành công', 'Thay đổi trạng thái người dùng thành công!', true);
        }
    });
</script>
</body>
</html>
