<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - G-SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --secondary: #ff4b2b;
            --dark-blue: #0f0c29;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #302b63 0%, #0f0c29 100%);
            color: white;
            overflow: hidden;
        }

        /* Hiệu ứng bóng bay nền đồng bộ với Homepage */
        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .circle { position: absolute; background: rgba(255, 65, 108, 0.1); border-radius: 50%; animation: move 15s infinite linear; }
        @keyframes move { from { transform: translateY(100vh); } to { transform: translateY(-10vh); } }

        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo-auth { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin-bottom: 30px; display: block; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i.icon-left { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); }
        .input-group i.icon-right { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; }
        .input-group i.icon-right:hover { color: rgba(255,255,255,0.8); }
        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .btn-auth {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-auth:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4); }
        .auth-footer { margin-top: 25px; font-size: 0.9rem; opacity: 0.7; }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

        .modal-content {
            background: #1a1a2e;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: white;
        }
        .modal-header {
            border-bottom: 1px solid var(--glass-border);
        }
        .modal-footer {
            border-top: 1px solid var(--glass-border);
        }
        .btn-close {
            filter: invert(1);
        }
    </style>
</head>
<body>
<div class="bg-animate" id="bg"></div>

<div class="auth-card">
    <a href="/home" class="logo-auth"><i class="fas fa-bolt"></i> G-SHOP</a>
    <h2>Chào mừng trở lại!</h2>
    <p style="margin-bottom: 30px; opacity: 0.6;">Vui lòng đăng nhập tài khoản</p>

    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <i class="fas fa-user icon-left"></i>
            <input type="text" name="username" placeholder="Tên đăng nhập hoặc email" required>
        </div>
        <div class="input-group">
            <i class="fas fa-lock icon-left"></i>
            <input type="password" name="password" id="passwordInput" placeholder="Mật khẩu" required>
            <i class="fas fa-eye icon-right" id="togglePassword" onclick="togglePassword()"></i>
        </div>
        <div style="text-align: right; margin-bottom: 15px;">
            <a href="/forgot-password" style="font-size: 0.8rem; color: var(--primary); text-decoration: none; opacity: 0.8;">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn-auth">ĐĂNG NHẬP NGAY</button>
    </form>

    <div class="auth-footer">
        Chưa có tài khoản? <a href="/register">Đăng ký thành viên</a>
    </div>
</div>

<!-- Modal Thông báo -->
<div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thông báo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalMessage"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const bg = document.getElementById('bg');
    for(let i=0; i<10; i++){
        const c = document.createElement('div');
        c.className = 'circle';
        c.style.width = c.style.height = Math.random()*100+50+'px';
        c.style.left = Math.random()*100+'%';
        c.style.animationDelay = Math.random()*5+'s';
        bg.appendChild(c);
    }

    // Hàm hiện/ẩn mật khẩu
    function togglePassword() {
        const passwordInput = document.getElementById('passwordInput');
        const toggleIcon = document.getElementById('togglePassword');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.className = 'fas fa-eye-slash icon-right';
        } else {
            passwordInput.type = 'password';
            toggleIcon.className = 'fas fa-eye icon-right';
        }
    }

    // Hàm hiển thị modal thông báo
    function showNotification(title, message, isSuccess) {
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
        
        modalTitle.innerHTML = '<i class="fas fa-' + (isSuccess ? 'check-circle' : 'exclamation-triangle') + ' me-2" style="color: ' + (isSuccess ? '#00ff88' : '#ff4b2b') + ';"></i>' + title;
        modalMessage.textContent = message;
        modal.show();
    }

    // Kiểm tra và hiển thị thông báo khi trang load
    window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('error')) {
            showNotification('Lỗi đăng nhập', 'Sai tài khoản hoặc mật khẩu!', false);
        }
        if (urlParams.has('logout')) {
            showNotification('Thông báo', 'Đã đăng xuất thành công.', true);
        }
        if (urlParams.has('resetSuccess')) {
            showNotification('Thành công', 'Mật khẩu đã được thay đổi thành công. Vui lòng đăng nhập lại!', true);
        }
    });
</script>
</body>
</html>
