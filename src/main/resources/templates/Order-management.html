<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng | G-SHOP Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff88;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #16213e, #0f0c29);
            color: #e0e0e0;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .nav-link {
            color: #aaa;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--primary-color);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .table {
            color: #e0e0e0;
            vertical-align: middle;
        }

        .table thead th {
            color: #9fb0c4;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom-color: var(--border-color);
        }

        .table td {
            border-bottom-color: var(--border-color);
        }

        .price-text {
            color: var(--primary-color);
            font-weight: 600;
        }

        .badge-success-order {
            background: rgba(0, 255, 136, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .badge-other-order {
            background: rgba(255, 75, 43, 0.2);
            color: #ff4b2b;
            border: 1px solid #ff4b2b;
        }

        .muted-small {
            color: #8f9bae;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="text-center mb-5">
                <h3 class="fw-bold" style="letter-spacing: 2px;">G-SHOP <span class="text-primary">ADMIN</span></h3>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/accounts}">
                        <i class="fas fa-gamepad me-2"></i> Kho Nick Game
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="fas fa-users me-2"></i> Quản lý người dùng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/orders}">
                        <i class="fas fa-receipt me-2"></i> Quản lý đơn hàng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/topups}">
                        <i class="fas fa-wallet me-2"></i> Yêu cầu nạp tiền
                    </a>
                </li>
                <li class="nav-item mt-5">
                    <a class="nav-link text-danger" th:href="@{/logout}">
                        <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                    </a>
                </li>
            </ul>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 mb-1">Quản lý đơn hàng</h1>
                    <div class="muted-small">Theo dõi toàn bộ giao dịch mua nick trên hệ thống.</div>
                </div>
                <a th:href="@{/admin/accounts}" class="btn btn-sm btn-outline-light">
                    <i class="fas fa-arrow-left me-1"></i> Về dashboard
                </a>
            </div>

            <div class="glass-card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Người mua</th>
                            <th>Nick đã mua</th>
                            <th>Giá</th>
                            <th>Thời gian mua</th>
                            <th>Trạng thái</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="6" class="text-center text-muted py-4">Chưa có đơn hàng nào.</td>
                        </tr>
                        <tr th:each="order : ${orders}">
                            <td class="fw-bold text-info" th:text="'#' + ${order.id}"></td>
                            <td>
                                <div class="fw-semibold" th:text="${order.user != null ? order.user.username : 'N/A'}"></div>
                                <div class="muted-small" th:text="${order.user != null ? 'User ID: ' + order.user.id : ''}"></div>
                            </td>
                            <td>
                                <div class="fw-semibold" th:text="${order.account != null ? order.account.accUsername : 'N/A'}"></div>
                                <div class="muted-small" th:text="${order.account != null ? 'Nick ID: #' + order.account.id : ''}"></div>
                            </td>
                            <td class="price-text" th:text="${#numbers.formatDecimal(order.amount != null ? order.amount : 0, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td th:text="${order.purchaseDate != null ? #temporals.format(order.purchaseDate, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                            <td>
                                <span th:if="${order.status == null || order.status == 'SUCCESS'}" class="badge badge-success-order">Thành công</span>
                                <span th:if="${order.status != null && order.status != 'SUCCESS'}" class="badge badge-other-order" th:text="${order.status}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
