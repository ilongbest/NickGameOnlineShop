<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - G-SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --secondary: #ff4b2b;
            --dark-blue: #0f0c29;
            --purple: #302b63;
            --success: #00ff88;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: white;
            background: radial-gradient(circle at center, var(--purple) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            padding: 72px 20px 40px;
            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: white;
            background: var(--glass);
            padding: 10px 18px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .back-home:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .profile-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
        }

        #userAvatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #userAvatar:hover {
            transform: scale(1.05);
        }

        .upload-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--primary);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid var(--dark-blue);
            transition: 0.3s;
        }

        .upload-btn:hover {
            background: var(--secondary);
            transform: scale(1.1);
        }

        .username {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role-badge {
            background: rgba(255, 65, 108, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .balance-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        .balance-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            margin-top: 5px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 65, 108, 0.2);
        }

        .btn-save,
        .btn-link-card {
            width: 100%;
            min-height: 46px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-save {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-link-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--glass-border);
            margin-top: 12px;
        }

        .btn-link-card:hover {
            background: rgba(255, 65, 108, 0.18);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
<div id="particles-js"></div>

<a href="/home" class="back-home">
    <i class="fas fa-arrow-left"></i> Quay lại trang chủ
</a>

<main class="container">
    <section class="glass-card profile-card">
        <div class="avatar-container">
            <img id="userAvatar" src="/images/default-avatar.png" alt="Avatar" onclick="document.getElementById('avatarInput').click()">
            <div class="upload-btn" onclick="document.getElementById('avatarInput').click()">
                <i class="fas fa-camera"></i>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display: none;">
        </div>

        <div class="username" id="userNameDisplay">Đang tải...</div>
        <div class="role-badge" id="userRole">Member</div>

        <div class="balance-box">
            <div class="balance-label">SỐ DƯ TÀI KHOẢN</div>
            <div class="balance-amount" id="userBalance">0đ</div>
        </div>

        <form id="updateUserForm" style="width: 100%;">
            <div class="form-group">
                <label>Email liên kết</label>
                <input type="email" id="email" class="form-control" required placeholder="Nhập email của bạn">
            </div>
            <button type="submit" class="btn-save" id="btnSave">
                <i class="fas fa-save"></i> Cập nhật thông tin
            </button>
        </form>

        <a href="/mynick" class="btn-link-card">
            <i class="fas fa-gamepad"></i> Nick đã mua
        </a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS("particles-js", {
        particles: {
            number: { value: 80, density: { enable: true, value_area: 800 } },
            color: { value: "#ffffff" },
            shape: { type: "circle" },
            opacity: { value: 0.2, random: false },
            size: { value: 3, random: true },
            line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.1, width: 1 },
            move: { enable: true, speed: 2, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
        },
        interactivity: {
            detect_on: "canvas",
            events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true }
        },
        retina_detect: true
    });

    let userId = null;

    async function loadUserData() {
        try {
            const meResponse = await fetch('/api/v1/users/me');
            if (!meResponse.ok) {
                throw new Error("Không tìm thấy người dùng đang đăng nhập.");
            }

            const currentUser = await meResponse.json();
            userId = currentUser.id;

            const response = await fetch(`/api/v1/users/${userId}`);
            if (!response.ok) {
                throw new Error("Không thể tải thông tin người dùng.");
            }

            const user = await response.json();
            document.getElementById('userNameDisplay').innerText = user.username;
            document.getElementById('userRole').innerText = user.role || 'MEMBER';
            document.getElementById('userBalance').innerText = new Intl.NumberFormat('vi-VN').format(user.balance || 0) + 'đ';
            document.getElementById('email').value = user.email || '';

            if (user.avatarUrl) {
                document.getElementById('userAvatar').src = user.avatarUrl;
            }
        } catch (error) {
            console.error("Lỗi khi tải thông tin người dùng:", error);
        }
    }

    loadUserData();

    document.getElementById('avatarInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) {
            return;
        }

        if (file.size > 3 * 1024 * 1024) {
            alert("Kích thước file ảnh quá lớn. Vui lòng chọn file nhỏ hơn 3MB.");
            this.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('userAvatar').src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('updateUserForm').onsubmit = async (e) => {
        e.preventDefault();

        const btnSave = document.getElementById('btnSave');
        const fileInput = document.getElementById('avatarInput');
        const emailValue = document.getElementById('email').value;

        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
        btnSave.disabled = true;

        try {
            if (!userId) {
                throw new Error("Không tìm thấy người dùng đang đăng nhập.");
            }

            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append("file", fileInput.files[0]);

                const uploadRes = await fetch(`/api/v1/users/${userId}/upload-avatar`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadRes.ok) {
                    throw new Error("Không thể tải ảnh đại diện lên máy chủ.");
                }

                document.getElementById('userAvatar').src = await uploadRes.text();
            }

            const infoRes = await fetch(`/api/v1/users/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailValue })
            });

            if (!infoRes.ok) {
                throw new Error("Không thể cập nhật thông tin email.");
            }

            alert("Thông tin cá nhân đã được lưu thành công.");
            window.location.href = `/home?v=${Date.now()}`;
        } catch (error) {
            alert(error.message);
        } finally {
            btnSave.innerHTML = '<i class="fas fa-save"></i> Cập nhật thông tin';
            btnSave.disabled = false;
        }
    };
</script>
</body>
</html>
