<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - G-SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --secondary: #ff4b2b;
            --dark-blue: #0f0c29;
            --purple: #302b63;
            --success: #00ff88;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            color: #fff;
            background: radial-gradient(circle at center, var(--purple) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .back-btn {
            text-decoration: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .summary {
            margin-bottom: 14px;
            opacity: 0.85;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #1a1a2e;
        }
        .card-body {
            padding: 14px;
        }
        .name {
            font-weight: 700;
            margin-bottom: 6px;
        }
        .price {
            color: var(--success);
            font-weight: 700;
            margin-bottom: 10px;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
        }
        .btn-detail { background: var(--primary); flex: 1; }
        .btn-remove { background: #a63a3a; }
        .empty {
            padding: 24px;
            border: 1px dashed var(--glass-border);
            border-radius: 12px;
            text-align: center;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-row">
        <a class="back-btn" href="/home"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        <button class="btn btn-remove" onclick="clearCart()"><i class="fas fa-trash"></i> Xóa toàn bộ</button>
    </div>

    <div class="title"><i class="fas fa-shopping-cart"></i> Giỏ hàng của bạn</div>
    <div class="summary" id="summaryText">Đang tải giỏ hàng...</div>
    <div class="grid" id="cartGrid"></div>
</div>

<script>
    function getCartItems() {
        try {
            const raw = JSON.parse(localStorage.getItem('gshopCartItems') || '[]');
            return Array.isArray(raw) ? raw : [];
        } catch (e) {
            return [];
        }
    }

    function saveCartItems(items) {
        localStorage.setItem('gshopCartItems', JSON.stringify(items));
    }

    function removeItemByIndex(index) {
        const items = getCartItems();
        items.splice(index, 1);
        saveCartItems(items);
        renderCart();
    }

    function clearCart() {
        localStorage.removeItem('gshopCartItems');
        renderCart();
    }

    async function renderCart() {
        const items = getCartItems();
        const grid = document.getElementById('cartGrid');
        const summary = document.getElementById('summaryText');

        if (items.length === 0) {
            summary.innerText = 'Giỏ hàng hiện đang trống.';
            grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Bạn chưa thêm sản phẩm nào vào giỏ hàng.</div>';
            return;
        }

        summary.innerText = `Bạn đang có ${items.length} sản phẩm trong giỏ hàng.`;
        const htmlParts = [];

        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            let account = null;
            try {
                const res = await fetch(`/api/v1/accounts/${item.accountId}`);
                if (res.ok) {
                    account = await res.json();
                }
            } catch (e) {}

            if (!account) {
                htmlParts.push(`
                    <div class="card">
                        <div class="card-body">
                            <div class="name">Sản phẩm #${item.accountId}</div>
                            <div class="price">Không tải được thông tin</div>
                            <div class="actions">
                                <button class="btn btn-remove" onclick="removeItemByIndex(${i})">Xóa</button>
                            </div>
                        </div>
                    </div>
                `);
                continue;
            }

            const imageUrl = account.images && account.images.length > 0
                ? account.images[0].url
                : 'https://via.placeholder.com/400x200?text=No+Image';
            const priceText = new Intl.NumberFormat('vi-VN').format(account.price || 0) + 'đ';

            htmlParts.push(`
                <div class="card">
                    <img src="${imageUrl}" alt="account">
                    <div class="card-body">
                        <div class="name">${account.accUsername || ('Nick #' + account.id)}</div>
                        <div class="price">${priceText}</div>
                        <div class="actions">
                            <button class="btn btn-detail" onclick="location.href='/nick-detail/${account.id}'">Xem chi tiết</button>
                            <button class="btn btn-remove" onclick="removeItemByIndex(${i})">Xóa</button>
                        </div>
                    </div>
                </div>
            `);
        }

        grid.innerHTML = htmlParts.join('');
    }

    document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
