<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp tiền ví - G-SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --secondary: #ff4b2b;
            --dark-blue: #0f0c29;
            --purple: #302b63;
            --success: #00ff88;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            color: #fff;
            background: radial-gradient(circle at center, var(--purple) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            margin-bottom: 20px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            border-radius: 12px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .muted {
            opacity: 0.75;
            font-size: 0.95rem;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
        }

        .label {
            opacity: 0.7;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .value {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--success);
        }

        .amount-input {
            width: 100%;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        .btn {
            margin-top: 14px;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
        }

        .modal-content img {
            width: 240px;
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            margin-top: 10px;
        }

        .memo {
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
            font-size: 0.9rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            background: #1b1738;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .modal-title {
            font-weight: 700;
            margin-bottom: 8px;
        }
        .confirm-btn {
            width: 100%;
            margin-top: 16px;
            background: linear-gradient(45deg, #00b09b, #96c93d);
        }

        @media (max-width: 768px) {
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/home" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>

    <div class="card">
        <div class="title">Nạp tiền vào ví</div>
        <div class="muted">Xin chào <strong th:text="${username}">user</strong>, nhập số tiền và quét QR để nạp vào ví.</div>

        <div class="row">
            <div class="box">
                <div class="label">Số dư hiện tại</div>
                <div class="value" id="currentBalance"
                     th:text="${#numbers.formatDecimal(currentBalance, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>

                <div class="label" style="margin-top: 16px;">Số tiền cần nạp (VND)</div>
                <input id="amountInput" type="number" class="amount-input" min="1000" step="1000" placeholder="Ví dụ: 100000">
                <button class="btn" onclick="generateQR()"><i class="fas fa-qrcode"></i> Hiển thị QR thanh toán</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="qrModal" onclick="closeQrModal(event)">
    <div class="modal-content">
        <button class="modal-close" onclick="closeQrModal()"><i class="fas fa-times"></i></button>
        <div class="modal-title">QR Thanh Toán</div>
        <div class="muted" style="margin-bottom: 10px;">Vui lòng quét mã và chuyển đúng nội dung bên dưới.</div>
        <img id="modalQrImage" src="/custom-qr/c__Users_long1_AppData_Roaming_Cursor_User_workspaceStorage_5e772ffae1e93ea466eb36ce0b18a11b_images_image-75574428-2992-4fba-a9fc-b18d94dbf89a.png" alt="QR Modal">
        <div class="memo" id="modalMemoText">Nội dung CK: chưa tạo</div>
        <button id="confirmBtn" class="btn confirm-btn" onclick="confirmTopup()" disabled>
            <i class="fas fa-check-circle"></i> Tôi đã chuyển khoản
        </button>
    </div>
</div>

<script th:inline="javascript">
    const currentUserId = /*[[${currentUserId}]]*/ 0;
    let selectedAmount = 0;
    let transferMemo = '';

    function generateQR() {
        const amount = parseInt(document.getElementById('amountInput').value, 10);
        if (!amount || amount < 1000) {
            alert('Vui lòng nhập số tiền hợp lệ (tối thiểu 1,000đ).');
            return;
        }

        selectedAmount = amount;
        transferMemo = `NAP${currentUserId}_${Date.now()}`;

        // Su dung anh QR co dinh do ban cung cap.
        const qrSrc = '/custom-qr/c__Users_long1_AppData_Roaming_Cursor_User_workspaceStorage_5e772ffae1e93ea466eb36ce0b18a11b_images_image-75574428-2992-4fba-a9fc-b18d94dbf89a.png';
        document.getElementById('modalQrImage').src = qrSrc;
        document.getElementById('modalMemoText').innerText = `Nội dung CK: ${transferMemo}`;
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal(event) {
        if (!event || event.target.id === 'qrModal') {
            document.getElementById('qrModal').style.display = 'none';
        }
    }

    async function confirmTopup() {
        if (!selectedAmount) {
            alert('Bạn chưa tạo QR nạp tiền.');
            return;
        }

        const btn = document.getElementById('confirmBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang gửi yêu cầu...';

        try {
            const form = new URLSearchParams();
            form.append('amount', selectedAmount.toString());
            form.append('transferMemo', transferMemo);

            const response = await fetch('/api/v1/wallet/topup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: form.toString()
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(err || 'Nạp tiền thất bại');
            }

            const data = await response.json();
            alert('Đã gửi yêu cầu nạp tiền. Admin sẽ kiểm tra giao dịch và cộng số dư cho bạn.');
            document.getElementById('amountInput').value = '';
            selectedAmount = 0;
            transferMemo = '';
            document.getElementById('qrModal').style.display = 'none';
        } catch (e) {
            alert(e.message || 'Có lỗi hệ thống khi nạp tiền.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Tôi đã chuyển khoản';
        }
    }
</script>
</body>
</html>
