<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick đã mua - G-SHOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff416c;
            --secondary: #ff4b2b;
            --dark-blue: #0f0c29;
            --purple: #302b63;
            --success: #00ff88;
            --warning: #ffb020;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-muted: rgba(255, 255, 255, 0.66);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            background: radial-gradient(circle at center, var(--purple) 0%, var(--dark-blue) 100%);
            padding: 72px 20px 40px;
        }

        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .top-actions {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-btn {
            min-height: 42px;
            color: white;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 18px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .nav-btn:hover {
            background: rgba(255, 65, 108, 0.22);
            border-color: var(--primary);
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        .page-head {
            margin-bottom: 24px;
        }

        .page-head h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .page-head p {
            color: var(--text-muted);
            max-width: 720px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            overflow: hidden;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 920px;
        }

        th, td {
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            text-align: left;
            vertical-align: middle;
        }

        th {
            color: var(--text-muted);
            font-size: 0.84rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.03);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.035);
        }

        .order-code {
            color: var(--primary);
            font-weight: 700;
        }

        .game-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            font-size: 0.82rem;
            margin-bottom: 6px;
        }

        .account-id {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .credential {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .credential-value {
            font-family: Consolas, Monaco, monospace;
            color: var(--success);
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            padding: 7px 10px;
            min-width: 170px;
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .password-value {
            color: var(--warning);
            background: rgba(255, 176, 32, 0.08);
            border-color: rgba(255, 176, 32, 0.2);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            color: white;
            background: rgba(255, 255, 255, 0.07);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex: 0 0 auto;
        }

        .icon-btn:hover {
            background: rgba(255, 65, 108, 0.22);
            border-color: var(--primary);
        }

        .date-text {
            color: rgba(255, 255, 255, 0.86);
            white-space: nowrap;
        }

        .empty-state,
        .loading-state {
            padding: 44px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i,
        .loading-state i {
            display: block;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: rgba(15, 12, 41, 0.94);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: 0.25s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            body {
                padding-top: 92px;
            }

            .top-actions {
                flex-wrap: wrap;
            }

            .nav-btn {
                flex: 1;
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>
<div id="particles-js"></div>

<div class="top-actions">
    <a href="/user-detail" class="nav-btn">
        <i class="fas fa-user"></i> Hồ sơ
    </a>
    <a href="/home" class="nav-btn">
        <i class="fas fa-house"></i> Trang chủ
    </a>
</div>

<main class="container">
    <header class="page-head">
        <h1>Nick đã mua</h1>
        <p>Danh sách tài khoản game bạn đã thanh toán thành công. Hãy đổi mật khẩu sau khi nhận nick để bảo vệ tài khoản.</p>
    </header>

    <section class="glass-card">
        <div id="nickContent" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            Đang tải danh sách nick đã mua...
        </div>
    </section>
</main>

<div id="toast" class="toast">Đã sao chép</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    particlesJS("particles-js", {
        particles: {
            number: { value: 70, density: { enable: true, value_area: 800 } },
            color: { value: "#ffffff" },
            shape: { type: "circle" },
            opacity: { value: 0.18, random: false },
            size: { value: 3, random: true },
            line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.09, width: 1 },
            move: { enable: true, speed: 2, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
        },
        interactivity: {
            detect_on: "canvas",
            events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true }
        },
        retina_detect: true
    });

    const nickContent = document.getElementById('nickContent');
    const toast = document.getElementById('toast');

    async function loadMyNicks() {
        try {
            const response = await fetch('/api/v1/orders/me');
            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }
            if (!response.ok) {
                throw new Error(await response.text());
            }

            const orders = await response.json();
            renderOrders(orders);
        } catch (error) {
            nickContent.className = 'empty-state';
            nickContent.innerHTML = `
                <i class="fas fa-circle-exclamation"></i>
                Không thể tải danh sách nick đã mua. ${escapeHtml(error.message || '')}
            `;
        }
    }

    function renderOrders(orders) {
        if (!orders || orders.length === 0) {
            nickContent.className = 'empty-state';
            nickContent.innerHTML = `
                <i class="fas fa-box-open"></i>
                Bạn chưa mua nick nào.
            `;
            return;
        }

        nickContent.className = 'table-wrap';
        nickContent.innerHTML = `
            <table>
                <thead>
                <tr>
                    <th>Mã đơn hàng</th>
                    <th>Nick</th>
                    <th>Tài khoản game</th>
                    <th>Mật khẩu</th>
                    <th>Thời gian mua</th>
                </tr>
                </thead>
                <tbody>
                ${orders.map((order, index) => renderOrderRow(order, index)).join('')}
                </tbody>
            </table>
        `;
    }

    function renderOrderRow(order, index) {
        const username = order.accountUsername || '';
        const password = order.accountPassword || '';
        const masked = '•'.repeat(Math.max(password.length, 8));

        return `
            <tr>
                <td><span class="order-code">#${escapeHtml(order.orderId)}</span></td>
                <td>
                    <div class="game-pill"><i class="fas fa-gamepad"></i>${escapeHtml(order.categoryName || 'Game')}</div>
                    <div class="account-id">Mã nick: #${escapeHtml(order.accountId || 'N/A')}</div>
                </td>
                <td>
                    <div class="credential">
                        <span class="credential-value" title="${escapeHtml(username)}">${escapeHtml(username)}</span>
                        <button type="button" class="icon-btn" title="Sao chép tài khoản" data-copy-value="${escapeHtml(username)}" onclick="copyFromButton(this, 'Đã sao chép tài khoản')">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </td>
                <td>
                    <div class="credential">
                        <span id="password-${index}" class="credential-value password-value" data-password="${escapeHtml(password)}" data-mask="${masked}">${masked}</span>
                        <button type="button" class="icon-btn" title="Ẩn/hiện mật khẩu" onclick="togglePassword(${index}, this)">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button type="button" class="icon-btn" title="Sao chép mật khẩu" data-copy-value="${escapeHtml(password)}" onclick="copyFromButton(this, 'Đã sao chép mật khẩu')">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </td>
                <td><span class="date-text">${formatDate(order.purchaseDate)}</span></td>
            </tr>
        `;
    }

    function togglePassword(index, button) {
        const passwordEl = document.getElementById(`password-${index}`);
        const icon = button.querySelector('i');
        const isVisible = passwordEl.dataset.visible === 'true';

        if (isVisible) {
            passwordEl.textContent = passwordEl.dataset.mask;
            passwordEl.dataset.visible = 'false';
            icon.className = 'fas fa-eye';
        } else {
            passwordEl.textContent = passwordEl.dataset.password;
            passwordEl.dataset.visible = 'true';
            icon.className = 'fas fa-eye-slash';
        }
    }

    async function copyFromButton(button, message) {
        const text = button.dataset.copyValue || '';
        try {
            await navigator.clipboard.writeText(text);
        } catch (error) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }
        showToast(message);
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function formatDate(value) {
        if (!value) {
            return 'N/A';
        }
        return new Date(value).toLocaleString('vi-VN');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    loadMyNicks();
</script>
</body>
</html>
